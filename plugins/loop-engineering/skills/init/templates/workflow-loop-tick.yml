# .github/workflows/loop-tick.yml — the loop's heartbeat (generated by /loop-engineering:init)
#
# Setup once:
#   1. Repo Settings → Secrets and variables → Actions → add ANTHROPIC_API_KEY
#   2. Push this file, then test with a manual run (Actions → Loop Tick → Run workflow)
#
# Note: PRs opened with the default github.token do NOT trigger other workflows (CI).
# If loop PRs must run CI, provide a PAT / GitHub App token and export it as GH_TOKEN below.

name: Loop Tick

on:
  schedule:
    - cron: "{{CRON}}"   # {{CRON_HUMAN}}
  workflow_dispatch: {}

concurrency:
  group: loop-tick
  cancel-in-progress: false   # queue ticks; never kill a running one mid-build

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read        # discover.sh reads recent CI runs via `gh run list`
  id-token: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the builder branches off {{DEFAULT_BRANCH}}; full history keeps git happy

{{SETUP_STEPS}}

      - name: Run one loop tick
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}   # lets discover.sh / `gh pr create` authenticate
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/loop-tick"
          claude_args: |
            --max-turns 50
            --allowedTools "Read,Edit,Write,Glob,Grep,Task,Bash(git:*),Bash(gh:*),Bash(bash:*),{{PM_TOOL_PATTERNS}}"
